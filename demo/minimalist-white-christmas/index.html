<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern White Christmas</title>
    <!-- Google Fonts: Montserrat & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;400&family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #c8c8c8;
            --text-color: #334155;
            --accent-silver: rgba(200, 200, 200, 0.4);
            --star-gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
            background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Snow Layer */
        #snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); }
        }

        /* Layout Container */
        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            padding: 0 60px;
            position: relative;
            z-index: 20;
        }

        /* Hero Text */
        .hero-text {
            flex: 1;
            animation: fadeInUp 1.5s ease-out;
        }

        .hero-text h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 100;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .hero-text span {
            display: block;
            color: #71717a;
            font-weight: 200;
            margin-top: 15px;
            letter-spacing: 0.3em;
            font-size: 0.4em;
            text-transform: uppercase;
        }

        /* Tree Section */
        .tree-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            animation: fadeIn 2s ease-in;
        }

        .tree-svg {
            width: 100%;
            max-width: 480px;
            height: auto;
            overflow: visible;
        }

        .tree-body {
            fill: rgba(255, 255, 255, 0.4);
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 0.5;
        }

        /* Ornaments with Firefly Pulse */
        .ornament {
            cursor: pointer;
            fill: var(--accent-silver);
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 0.5;
            transition: fill 0.8s cubic-bezier(0.4, 0, 0.2, 1), filter 0.8s ease;
            animation: pulse-breathing 4s infinite ease-in-out;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes pulse-breathing {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .ornament.is-active {
            fill: var(--glow-color, #fbbf24);
            stroke: #ffffff;
            stroke-width: 1;
            filter: drop-shadow(0 0 10px var(--glow-color, #fbbf24));
        }

        /* Star Styling */
        .tree-star {
            cursor: pointer;
            fill: var(--star-gold);
            filter: drop-shadow(0 0 8px var(--star-gold)) drop-shadow(0 0 15px var(--star-gold));
            transform-origin: 200px 50px; /* Center of the star peak */
            animation: star-sparkle 3s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        @keyframes star-sparkle {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--star-gold)); }
            50% { transform: scale(1.18); filter: drop-shadow(0 0 20px var(--star-gold)) drop-shadow(0 0 35px var(--star-gold)); }
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 20%;
            right: 0%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 300;
            text-align: center;
            pointer-events: none;
            z-index: 30;
            animation: puka-puka 3s infinite ease-in-out;
            transition: opacity 0.6s ease, transform 0.6s ease;
            white-space: nowrap;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.9);
        }

        @keyframes puka-puka {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden {
            opacity: 0;
            transform: translateY(-15px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding-top: 40px;
            }
            .hero-text { margin-bottom: 50px; flex: none; }
            .tree-container { justify-content: center; width: 100%; flex: none; }
            .speech-bubble { top: -40px; right: 0; left: 0; margin: auto; width: max-content; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="snow-container"></div>

    <div class="container">
        <div class="hero-text">
            <h1>Silent Night,<br><span>Holy Night</span></h1>
        </div>

        <div class="tree-container">
            <div id="hint-bubble" class="speech-bubble">タッチで<br>ツリーを輝かせよう！</div>
            <svg class="tree-svg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Tree Shape -->
                <path class="tree-body" d="M200 60 L360 540 H40 L200 60Z" />
                
                <!-- Accents -->
                <line x1="200" y1="60" x2="200" y2="540" stroke="white" stroke-width="0.3" opacity="0.3" />
                <line x1="120" y1="300" x2="280" y2="300" stroke="white" stroke-width="0.3" opacity="0.2" />

                <!-- Ornaments -->
                <circle class="ornament" cx="200" cy="160" r="8" style="--glow-color: #fbbf24; animation-delay: 0.1s;" />
                <circle class="ornament" cx="160" cy="260" r="7" style="--glow-color: #fca5a5; animation-delay: 1.4s;" />
                <circle class="ornament" cx="240" cy="280" r="9" style="--glow-color: #93c5fd; animation-delay: 0.6s;" />
                <circle class="ornament" cx="140" cy="380" r="10" style="--glow-color: #86efac; animation-delay: 2.2s;" />
                <circle class="ornament" cx="270" cy="400" r="7" style="--glow-color: #fcd34d; animation-delay: 1.7s;" />
                <circle class="ornament" cx="190" cy="470" r="12" style="--glow-color: #d8b4fe; animation-delay: 0.9s;" />
                <circle class="ornament" cx="100" cy="510" r="8" style="--glow-color: #fda4af; animation-delay: 3.1s;" />
                <circle class="ornament" cx="300" cy="510" r="8" style="--glow-color: #fbbf24; animation-delay: 2.0s;" />

                <!-- Top Star -->
                <polygon id="tree-star" class="tree-star" points="200,20 206,42 228,42 211,56 217,78 200,65 183,78 189,56 172,42 194,42" />
            </svg>
        </div>
    </div>

    <script>
        // 1. Snowfall
        const snowContainer = document.getElementById('snow-container');
        const flakeCount = 80;

        function createSnowflake() {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            const size = Math.random() * 3 + 1.5;
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * -20;
            const opacity = Math.random() * 0.5 + 0.3;

            flake.style.width = `${size}px`;
            flake.style.height = `${size}px`;
            flake.style.left = `${left}%`;
            flake.style.animationDuration = `${duration}s`;
            flake.style.animationDelay = `${delay}s`;
            flake.style.opacity = opacity;
            snowContainer.appendChild(flake);
        }

        for (let i = 0; i < flakeCount; i++) createSnowflake();

        // 2. Interactive Logic
        const ornaments = document.querySelectorAll('.ornament');
        const star = document.getElementById('tree-star');
        const bubble = document.getElementById('hint-bubble');
        let interacted = false;

        function hideBubble() {
            if (!interacted) {
                bubble.classList.add('hidden');
                interacted = true;
            }
        }

        // Toggle individual ornaments
        ornaments.forEach(o => {
            o.addEventListener('click', () => {
                hideBubble();
                o.classList.toggle('is-active');
            });
            o.addEventListener('touchstart', (e) => {
                e.preventDefault();
                hideBubble();
                o.classList.toggle('is-active');
            }, {passive: false});
        });

        // Star logic: Toggle all
        star.addEventListener('click', () => {
            hideBubble();
            const anyInactive = Array.from(ornaments).some(o => !o.classList.contains('is-active'));
            ornaments.forEach(o => {
                if (anyInactive) o.classList.add('is-active');
                else o.classList.remove('is-active');
            });
        });

        star.addEventListener('touchstart', (e) => {
            e.preventDefault();
            hideBubble();
            const anyInactive = Array.from(ornaments).some(o => !o.classList.contains('is-active'));
            ornaments.forEach(o => {
                if (anyInactive) o.classList.add('is-active');
                else o.classList.remove('is-active');
            });
        }, {passive: false});
    </script>
</body>
</html>
